version: '3.9'

services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  ganache:
    image: trufflesuite/ganache:latest
    command: --host 0.0.0.0 --port 7545 --deterministic
    ports:
      - '7545:7545'

  auth-service:
    build: ./services/auth-service
    env_file: .env
    depends_on:
      - mongo

  crypto-service:
    build: ./services/crypto-service
    env_file: .env

  blockchain-service:
    build: ./services/blockchain-service
    env_file: .env
    depends_on:
      - ganache

  messaging-service:
    build: ./services/messaging-service
    env_file: .env
    depends_on:
      - mongo
      - crypto-service
      - blockchain-service

  gateway:
    build: ./backend/gateway
    env_file: .env
    depends_on:
      - auth-service
      - messaging-service

  frontend:
    build: ./frontend
    depends_on:
      - gateway

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    depends_on:
      - frontend
      - gateway

volumes:
  mongo_data:
